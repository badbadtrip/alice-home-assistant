name: Check
on:
  push:
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
  bridge:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: alice/bridge/go.mod
          cache-dependency-path: alice/bridge/go.sum
      - run: go test ./...
        working-directory: alice/bridge
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alice-ha-app:ci ./alice
