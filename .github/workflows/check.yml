name: Check
on:
  push:
    # main only receives commits already checked on their claude/ branch.
    branches-ignore:
      - main
  pull_request:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
  bridge:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: alice/bridge/go.mod
          cache-dependency-path: alice/bridge/go.sum
      - run: go test ./...
        working-directory: alice/bridge
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alice/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: alice/server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
