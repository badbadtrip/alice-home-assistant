name: Image
on:
  push:
    branches-ignore:
      - main
    paths:
      - alice/**
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        run: echo "version=$(sed -n 's/^version:[[:space:]]*"\(.*\)"/\1/p' alice/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: alice
          push: true
          provenance: false
          tags: ghcr.io/badbadtrip/alice-home-assistant-${{ matrix.arch }}:${{ steps.release.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/badbadtrip/alice-home-assistant
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
