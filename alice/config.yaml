name: Алиса
version: "0.62.1"
image: ghcr.io/badbadtrip/alice-home-assistant-{arch}
slug: alice
description: Колонки Алисы, голосовые команды, установка мостов и встроенная Wiki
url: https://github.com/badbadtrip/alice-home-assistant
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_admin: true
panel_title: Алиса
panel_icon: mdi:account-voice
ports:
  18080/tcp: 18080
ports_description:
  18080/tcp: Home Functions для колонок в локальной сети (с токеном)
backup: cold
map:
  - type: app_config
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  advertised_url: ""
  speaker_network: "0.0.0.0/0"
  voice_command_label: alice_voice_commands
  device_labels:
    - alice
  llm_base_url: ""
  llm_model: ""
  llm_api_key: ""
  music_assistant_url: ""
  music_assistant_token: ""
schema:
  advertised_url: str
  speaker_network: str
  voice_command_label: str
  device_labels:
    - str
  llm_base_url: str
  llm_model: str
  llm_api_key: password
  music_assistant_url: str?
  music_assistant_token: password?
